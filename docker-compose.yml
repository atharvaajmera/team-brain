services:
  chroma-db:
    image: chromadb/chroma:0.5.5
    volumes:
      - chroma-data:/chroma/chroma
    ports:
      - "8000:8000"
    restart: unless-stopped

  bot:
    build: .
    command: ["slack_bot.py"]
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OLLAMA_URL=${OLLAMA_URL}
      - MODEL=${MODEL}
      - SLACK_WORKSPACE=${SLACK_WORKSPACE}
      - PORT=${PORT}
      - CHROMA_HOST=chroma-db
      - CHROMA_PORT=8000
    depends_on:
      - chroma-db
    restart: unless-stopped

  sync-worker:
    build: .
    command: ["sync_job.py"]
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CHROMA_HOST=chroma-db
      - CHROMA_PORT=8000
    volumes:
      - sync-state:/app/config
    depends_on:
      - chroma-db
    restart: unless-stopped

volumes:
  chroma-data:
  sync-state:
